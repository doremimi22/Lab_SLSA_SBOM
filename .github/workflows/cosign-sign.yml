name: Keyless Artifact Signing with Cosign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-sign:
    name: Build and Sign Artifact
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Package Python application
      - name: Package Release Artifact
        run: |
          tar -czvf release.tar.gz app.py
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "Package created successfully"

      # Step 3: Install Sigstore Cosign
      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.10.0

      # Step 4: Sign artifact without long-term keys
      - name: Sign Artifact Keylessly
        run: |
          cosign sign-blob --yes \
            --output-signature release.tar.gz.sig \
            --output-certificate release.tar.gz.pem \
            release.tar.gz

          echo "Keyless signing completed"

      # Step 5: Verify signature and certificate
      - name: Verify Signed Artifact
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            WORKFLOW_REF="refs/tags/${REF_NAME}"
          else
            WORKFLOW_REF="refs/heads/${REF_NAME}"
          fi

          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/cosign-sign.yml@${WORKFLOW_REF}"

          cosign verify-blob \
            --certificate release.tar.gz.pem \
            --signature release.tar.gz.sig \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release.tar.gz

          echo "Signature verification completed"

      # Step 6: Upload signed artifacts
      - name: Upload Signed Artifacts Package
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-package
          path: |
            release.tar.gz
            release.tar.gz.sig
            release.tar.gz.pem
            release.tar.gz.sha256
          retention-days: 30
